# Render Blueprint (demo / test hosting). In Render: New -> Blueprint -> pick this repo -> Apply.
# It creates the database, the API and the web app, and wires them together.
#
# Free plan limits (fine for showing the app, NOT for real patient data):
#  - services sleep after 15 minutes without visits; the first visit after that takes ~1 minute
#  - the free database expires after 30 days
#  - no disk: uploaded documents are lost when the API restarts or redeploys
# For real use change every `plan: free` to a paid plan and add a disk to the API (mount /app/storage).

databases:
  - name: ayush-epr-db
    plan: free
    region: frankfurt
    databaseName: ayush_epr
    user: ayush
    postgresMajorVersion: "16"

services:
  - type: web
    name: ayush-epr-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      # Render's proxy plus the Next.js proxy in front of the API.
      - key: TRUST_PROXY
        value: "2"
      - key: SESSION_HOURS
        value: "8"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: ayush-epr-db
          property: connectionString
      # Random once, then kept. Losing it makes every password unusable, so never regenerate it.
      - key: PASSWORD_SALT
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Asked for when the Blueprint is applied (12+ characters). Delete it after the first sign-in.
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: ayush-epr-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    envVars:
      # Baked in at build time (Render passes it as the Docker build arg). Free services can't receive
      # private-network traffic, so this is the API's public address. If Render gave the API another
      # address (name already taken), change it here or in the dashboard and redeploy the web service.
      - key: API_URL
        value: https://ayush-epr-api.onrender.com
